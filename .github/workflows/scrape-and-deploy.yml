name: Scrape and Deploy Pages

on:
  schedule:
    # 台灣上班時段 08:00–20:45（UTC 00:00–12:45）每 15 分鐘同步一次
    - cron: "*/15 0-12 * * *"
    # 夜間每小時同步一次
    - cron: "0 13-23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scraper.py"
      - "requirements.txt"
      - "events.json"
      - ".github/workflows/scrape-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape events
        env:
          PYTHONIOENCODING: utf-8
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: python scraper.py

      - name: Commit updated events.json
        id: check
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "events.json unchanged"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git commit -m "chore: update events.json from scraper"
            git push
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare site
        if: steps.check.outputs.should_deploy == 'true'
        run: |
          mkdir -p _site
          cp index.html events.json _site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.should_deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4