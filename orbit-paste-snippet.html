<div class="sdgs-activity-embed" style="width:100%;margin:8px 0 16px;">
  <iframe
    id="sdgs-activity-frame"
    src="https://fgu-ytc.github.io/FGU-Sustainable-Event/?embed=1"
    title="永續活動列表"
    loading="lazy"
    style="width:100%;height:420px;border:0;display:block;background:transparent;overflow:hidden;"
  ></iframe>
</div>
<script>
(function () {
  function onMessage(event) {
    var data = event.data;
    if (!data || data.source !== "sdgs-activity" || data.type !== "resize") return;
    var frame = document.getElementById("sdgs-activity-frame");
    if (!frame) return;
    var h = Number(data.height) || 0;
    if (h < 280) h = 280;
    if (h > 4000) h = 4000;
    frame.style.height = h + "px";
  }
  window.addEventListener("message", onMessage);
})();
</script>
